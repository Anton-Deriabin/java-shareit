services:
  gateway:
    build: gateway
    image: shareit-gateway
    container_name: shareit-gateway
    ports:
      - "8080:8080"
    depends_on:
      - server
    environment:
      - SHAREIT_SERVER_URL=http://server:9090

  server:
    build: server
    image: shareit-server
    container_name: shareit-server
    ports:
      - "9090:9090"
    depends_on:
      - mongodb
    environment:
        - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/shareit
        - JAVA_TOOL_OPTIONS=-Duser.timezone=Europe/Moscow

  mongodb:
    image: mongo:7.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand({ ping: 1 })' | mongo mongodb:27017/shareit --quiet"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo_data: